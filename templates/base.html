<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding and viewport for responsive design -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AHSH's Pizza Site</title>
    <!-- Bootstrap CSS framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom styles -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <!-- Navigation bar - displayed on all pages -->
     <!-- TODO: Add a navigation bar that will be displayed on all pages.  
           It should have the logo on the left and links to the menu, cart and about us pages on the right.
     -->

    <!-- Main content area - injected by child templates -->
    <div class="container mt-4">{% block content %}{% endblock %}</div>

    <!-- Bootstrap JavaScript for interactive components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
